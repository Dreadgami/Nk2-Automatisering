[defaults]
# Inventory ligger i repoet, så vi slipper -i ved hver kjøring
inventory = inventory/hosts.yml
# Lab: nye enheter får ny SSH-nøkkel etter hver reset
host_key_checking = False
# Lesbar utskrift
callback_result_format = yaml

[persistent_connection]
# IOS kan være treg (spesielt 2960 og 2901)
connect_timeout = 60
command_timeout = 60
